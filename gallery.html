<!DOCTYPE html>

<head>
<meta charset="UTF-8">

<link rel="stylesheet" href="css/site.css">
<style>
body{background:#0b0c0e}
.gal-head{padding:64px 0 8px;text-align:center}
.gal-head h1{margin:0 auto;font-size:clamp(1.9rem,4vw,2.8rem)}
.gal-head h1 span{color:var(--muted);font-weight:400}
.gal-wrap{max-width:1320px;margin:0 auto;padding:0 24px}
.gal{display:flex;flex-direction:column;gap:44px;padding:40px 0 90px}
.gal .shot{border-radius:6px;overflow:hidden;border:1px solid rgba(255,255,255,.09);box-shadow:0 1px 0 rgba(255,255,255,.05) inset,0 30px 60px -20px rgba(0,0,0,.8)}
.gal .shot img{width:100%;display:block;pointer-events:none;user-select:none;-webkit-user-drag:none;image-rendering:-webkit-optimize-contrast;filter:contrast(1.06) saturate(1.07)}
</style>
</head>
<body class="protected">

<header class="site">
  <div class="wrap">
    <div class="logo"><a href="index.html" style="color:inherit;text-decoration:none">LISTING<b>&middot;</b>IQ</a></div>
    <nav class="main">
      <a href="gallery.html">Gallery</a>
      <a href="testimonials.html">Testimonials</a>
      <a href="index.html#contact" class="cta">Get a free sample</a>
    </nav>
  </div>
</header>

<div class="gal-head">
  <div class="wrap">
    <h1>Gallery <span>/ past work</span></h1>
  </div>
</div>

<div class="gal-wrap">
  <div class="gal">
    <div class="shot"><img src="assets/ba-front.jpg" alt="Before and after — front elevation, proposed modern build"></div>
    <div class="shot"><img src="assets/ba-aerial.jpg" alt="Before and after — aerial view of the lot, proposed estate"></div>
    <div class="shot"><img src="assets/ba-backyard.jpg" alt="Before and after — backyard resort concept"></div>
    <div class="shot"><img src="assets/ba-coastal.jpg" alt="Before and after — coastal farmhouse renovation"></div>
  </div>
</div>

<script src="js/site.js"></script>
